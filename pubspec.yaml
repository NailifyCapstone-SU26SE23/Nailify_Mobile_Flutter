name: nailify_mobile
description: "Nail testing and appointment booking project via mobile."
#publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9

  flutter_map: ^8.3.0
  latlong2: ^0.10.1

  # State Management (BLoC/Cubit)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  provider: ^6.1.2

  # Navigation
  go_router: ^17.3.0

  # Network & API
  dio: ^5.4.0
  google_sign_in: ^7.2.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^7.1.1

  # Real-time & Push Notifications
  signalr_netcore: ^1.4.4
  logging: ^1.3.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Utilities & Dependency Injection
  get_it: ^9.2.1
  image_picker: ^1.2.2
  qr_flutter: ^4.1.0

  # AI & Snapshot Try-on dependencies
  onnxruntime: ^1.4.1
  image: ^4.8.0
  http: ^1.2.0
  hand_landmarker: ^3.0.0

  # Localization (Hỗ trợ core hệ thống)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:

  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - android/app/google-login.json
    - assets/models/